<!-- GitHub README with Embedded Likes
     
     This file shows how to add likes directly to your GitHub README.md
     Note: Comments require a comments section, but likes can be simple embeds.
     
     Save this as an HTML file in your repo and reference it from your README.
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>README Likes - Click to Like This Project</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: white;
            padding: 20px;
            margin: 0;
        }

        .readme-stats {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        [data-like-button] {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: white;
            border: 2px solid #e1e4e8;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: #24292e;
            transition: all 0.2s ease;
        }

        [data-like-button]:hover:not(:disabled) {
            border-color: #0366d6;
            color: #0366d6;
        }

        [data-like-button].is-liked {
            background: #fffacd;
            border-color: #ffc107;
            color: #856404;
        }

        [data-like-button]:disabled {
            opacity: 0.7;
            cursor: default;
        }

        .info {
            background: #f6f8fa;
            border: 1px solid #e1e4e8;
            border-radius: 6px;
            padding: 15px;
            margin-top: 20px;
            font-size: 14px;
            color: #586069;
        }
    </style>
</head>
<body>
    <div class="readme-stats">
        <!-- Stars Badge (example) -->
        <a href="https://github.com/your-username/your-repo">
            <img alt="GitHub Stars" src="https://img.shields.io/github/stars/your-username/your-repo?style=flat-square&logo=github">
        </a>

        <!-- Likes Button -->
        <button 
            data-like-button 
            data-path="/"
            aria-label="Like this project"
        >
            <span>❤️</span>
            <span>Like this</span> 
            (<span data-like-count>0</span>)
        </button>

        <!-- Forks Badge (example) -->
        <a href="https://github.com/your-username/your-repo/forks">
            <img alt="GitHub Forks" src="https://img.shields.io/github/forks/your-username/your-repo?style=flat-square&logo=github">
        </a>
    </div>

    <div class="info">
        <strong>💡 Tip:</strong> Click the like button to show your appreciation for this project!
        Your like is saved in your browser and helps track project interest.
    </div>

    <script>
        window.LIKES_CONFIG = {
            endpoint: 'https://YOUR_WORKER_URL/likes'
        };
    </script>
    <script src="../client/likes.js"></script>
</body>
</html>
